# The docs site, built by Zensical (docs/decisions/0017), which reads this file as MkDocs did:
# .venv/bin/zensical serve (http://127.0.0.1:8000) or zensical build (into site/, not versioned).
# Sections follow Diátaxis: tutorials, how-to guides, reference, explanation; then the decisions (ADRs). The log is private.
# STATUS, MEMORY_MAP, the data-contract tables and a model page's measured block are rendered from their sources by Zensical's macros
# (kit/tools/docs_macros.py; define_env runs once per page there).
site_name: Camset
site_description: Sony camera settings files (CAMSET .DAT), the editor and the mapping kit
# the public repository (set 2026-11-09): the site links back to it, and GitHub Pages serves the site at site_url
site_url: https://camset-dev.github.io/camset/
repo_url: https://github.com/camset-dev/camset
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
  features: [navigation.sections, navigation.top, search.highlight, content.code.copy]
plugins:
  - search
  - macros:
      module_name: kit/tools/docs_macros
      render_by_default: false
      on_error_fail: true        # a macro that fails stops the build, rather than printing its error in the page
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc: {permalink: true}
  - pymdownx.superfences
  - pymdownx.snippets: {base_path: [".", "docs"], check_paths: true}
nav:
  - Home: index.md
  # not a page of docs/: the docs workflow builds it into site/viewer/ (kit/tools/proof_viewer.py --public), and a
  # relative entry is taken from the site's root
  - Definition viewer: viewer/
  - Tutorials:
      - From nothing to a first proved setting: QUICKSTART.md
  - How-to guides:
      - Use the editor: EDITOR.md
      - Map another camera: REMAPPING_PLAYBOOK.md
      - Update your clone: UPDATING.md
      - Run on Windows and Linux: PORTING.md
      - Releasing: RELEASING.md
  - Reference:
      - Status: STATUS.md
      - The file format: formats/index.md
      - Memory map: MEMORY_MAP.md
      - Data files and their schemas: DATA_CONTRACTS.md
      # the model pages: written by kit/tools/build_docs.py from docs/models/*.md; add a page there, not here
      - "ILCE-1M2, firmware 4.00": models/ILCE-1M2_fw4.00.md
      # end of the model pages
  - Explanation:
      - The kit's design: KIT_PLAN.md
      - Which cameras the kit works with: CAMERA_SUPPORT.md
      - Where each fact lives: WHERE_FACTS_LIVE.md
  - Decisions: decisions/index.md

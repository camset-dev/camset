# Builds the editor for macOS, Linux and Windows (there a zip and an installer) and keeps the packages as build
# artifacts, and the definition viewer as one file (camset-viewer.html: every camera definition with its sample, from
# the public files alone, a page that opens from disk with no network; kit/tools/proof_viewer.py --public --single).
# On a version tag (v0.2.0, say) pushed to GitHub, the release job also publishes a Release for that tag with the
# packages and the viewer attached
# (each package carries the project's LICENSE and its own third-party licences page; the viewer keeps one name, so
# releases/latest/download/camset-viewer.html is its address); run by hand (workflow_dispatch) it keeps the artifacts
# only. A pushed tag builds only when the commit it names is on main: the test job checks that first and stops the
# workflow otherwise (docs/CODE_SIGNING_POLICY.md). Gitea Actions reads this folder too and has no GitHub Releases
# API, so the release job skips itself there. Pull requests and main are checked by kit-ci.yml and editor-ci.yml; this workflow runs their
# tests again only as the gate before a release's packages are built.
#
# Every action is pinned to a full commit, its version in the comment beside it (looked up 2026-11-09), so a tag
# moved upstream cannot change what builds or publishes a release; move a pin to a newer release by its commit.
# The internal macOS build (CAMSET_INTERNAL=1) is never made here: build_macos_app.sh refuses it in CI.
name: Editor packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # the whole history and every branch (fetch-depth: 0), which the check below needs; the checkout fetches them
      # with the workflow's token and keeps no credentials afterwards, on GitHub and on Gitea alike
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # a release is built only from a commit of main (docs/CODE_SIGNING_POLICY.md): a tag on any other commit, or
      # pushed before main was, stops the workflow here, before anything is built; HEAD is the commit the tag names. A
      # check against mistakes: run by hand, the workflow builds what it is given and publishes nothing, so it is not
      # checked, and a tag on an older commit runs that commit's own copy of this file
      - name: The tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::The main branch was not fetched, so whether the tag $GITHUB_REF_NAME is on it cannot be checked. Nothing was built: re-run this job."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME is on a commit that is not on main on GitHub. Nothing was built. If the commit is meant for main, push main first, then re-run this job; otherwise tag a commit of main and push that tag (docs/RELEASING.md)."
            exit 1
          fi
          echo "The tag $GITHUB_REF_NAME is on main."
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the kit's Python packages (pinned, kit/requirements.txt)
        run: python -m pip install -r kit/requirements.txt
      - name: Python tests
        run: |
          python -m pytest -q kit/tests
          python kit/tools/check_public.py --all
      - name: The definition viewer as one file (a release download)
        # from editor/definitions/ alone, after the tests and check_public passed; under site/, where the tool writes
        # inside a clone (git-ignored)
        run: python kit/tools/proof_viewer.py --public --single --out site/camset-viewer.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camset-viewer
          path: site/camset-viewer.html
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch: the current stable Rust
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev
      - name: Rust tests
        working-directory: editor
        run: cargo test --release --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]   # Windows since 2026-11-12: built, tested and used on a Windows 11 PC first (docs/RELEASING.md)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # the stable branch: the current stable Rust
      - name: Linux libraries (windowing; the file dialogs use the desktop portal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev
      - name: Tests
        run: cargo test --release --locked
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about@0.9.3
      - name: Third-party licences (the crates built for this system and the fonts egui builds in; every package below carries the page)
        shell: bash
        run: |
          mkdir -p target/dist
          cargo about generate --locked --target "$(rustc -vV | sed -n 's/^host: //p')" -o target/dist/THIRD_PARTY_LICENSES.html about.hbs
      - name: macOS app and disk image
        if: runner.os == 'macOS'
        run: sh packaging/build_macos_app.sh
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: sh packaging/build_linux.sh
      - name: Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        # one folder zipped, as the Linux tarball is one folder, so unpacking spills nothing loose: the program, the
        # camera definitions (each with its sample) in definitions/ beside it, where the editor looks for them, the
        # project's licence as LICENSE.txt (as on the macOS disk image; it opens with a double-click) and the
        # licences page beside the program, where Settings > About > Third-party licences looks
        # The program's version details are checked first: build.rs links them and the icon from one .res file, and a
        # build that could not make it only warns, so an exe without them would otherwise be zipped and released.
        # Windows shows no icon to a script (any exe gets one), so the details stand for both.
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $info = (Get-Item target/release/camset_editor.exe).VersionInfo
          "ProductName: $($info.ProductName); FileDescription: $($info.FileDescription); ProductVersion: $($info.ProductVersion)"
          if ($info.ProductName -cne 'Camset Editor' -or $info.FileDescription -cne 'Camset Editor' -or $info.ProductVersion -cne $v) { throw "camset_editor.exe lacks its icon and version details (Camset Editor $v): build.rs did not link them; its warning in the build's log says why" }
          $name = "camset-editor-$v-windows-x64"
          $dir = "target/dist/$name"
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          New-Item -ItemType Directory -Force $dir | Out-Null
          if (-not (Test-Path definitions/*.json)) { throw "definitions/ holds no camera definition" }
          Copy-Item target/release/camset_editor.exe $dir
          Copy-Item -Recurse definitions "$dir/definitions"
          Copy-Item ../LICENSE "$dir/LICENSE.txt"
          Copy-Item target/dist/THIRD_PARTY_LICENSES.html $dir
          Compress-Archive -LiteralPath $dir -DestinationPath "target/dist/$name.zip" -Force
          # what the zip holds, in the log
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip =[System.IO.Compression.ZipFile]::OpenRead("$PWD/target/dist/$name.zip")
          $zip.Entries.FullName
          $zip.Dispose()
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        # Inno Setup builds it from the folder the zip step staged, into target/dist beside the zip
        # (packaging/windows/installer.iss says what it installs, and what it never touches: per user, with no
        # administrator rights). ISCC.exe, its compiler, comes with GitHub's Windows runners, in its own folder (taken
        # first: on the PATH is Chocolatey's stand-in for it) or on the PATH; nothing is downloaded for it, and the step
        # stops, saying so, on a runner without it. The version is Cargo.toml's and the copyright sentence the first of
        # the program's copyright detail (Inno Setup keeps 100 characters of it, and the program's whole line is
        # longer), both passed in. The installer's own version details (what a signing service asks for on every file
        # it signs: the product's name and version) are then checked as the zip step checks the program's, with the
        # spaces Inno Setup pads each to its slot's width trimmed: Camset Editor, the program's version, publisher and
        # copyright sentence. The same lines compile the installer in editor-ci.yml on every pull request.
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $exe = Get-Item "target/dist/camset-editor-$v-windows-x64/camset_editor.exe"
          $copyright = ($exe.VersionInfo.LegalCopyright -split '(?<=\.) ', 2)[0]
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) is not on this runner, neither on the PATH nor in C:\Program Files (x86)\Inno Setup 6: GitHub's Windows images have carried it (their list of installed software says which version). Install it here by a pinned version with its checksum, never a bare download." }
          "Inno Setup $((Get-Item $iscc).VersionInfo.ProductVersion): $iscc"
          & $iscc "/DAppVersion=$v" "/DAppCopyright=$copyright" packaging\windows\installer.iss
          if ($LASTEXITCODE) { throw "ISCC.exe stopped with exit code ${LASTEXITCODE}: its message above says why" }
          $setup = Get-Item "target/dist/camset-editor-$v-windows-x64-setup.exe" -ErrorAction SilentlyContinue
          if (-not $setup -or $setup.Length -lt 1MB) { throw "ISCC.exe made no installer of a program's size at target/dist/camset-editor-$v-windows-x64-setup.exe" }
          $info = [ordered]@{}
          foreach ($k in 'ProductName', 'ProductVersion', 'FileVersion', 'FileDescription', 'CompanyName', 'LegalCopyright') { $info[$k] = "$($setup.VersionInfo.$k)".TrimEnd() }
          "$($setup.Name): $($setup.Length) bytes; " + (($info.Keys | ForEach-Object { "$($_): $($info[$_])" }) -join '; ')
          if ($info.ProductName -cne 'Camset Editor' -or $info.ProductVersion -cne $v -or $info.FileVersion -cne $v -or $info.FileDescription -cne 'Camset Editor Setup' -or $info.CompanyName -cne 'Camset contributors' -or $info.LegalCopyright -cne $copyright) { throw "$($setup.Name) lacks its version details (Camset Editor $v and the copyright sentence of camset_editor.exe): the VersionInfo lines of installer.iss say what it carries" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camset-editor-${{ runner.os }}
          path: |
            editor/target/dist/*.dmg
            editor/target/dist/*.tar.gz
            editor/target/dist/*.zip
            editor/target/dist/*.exe

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: camset-editor-*
          merge-multiple: true
          path: dist
      # the definition viewer the test job built: by its name, so a release without it stops here
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: camset-viewer
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/camset-viewer.html

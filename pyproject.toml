[tool.pytest.ini_options]
testpaths = ["kit/tests"]
pythonpath = ["kit", "kit/provers", "kit/tools"]
norecursedirs = ["private", "runs", "site", "editor", ".venv", ".git"]

# ruff (uvx ruff check kit; the pre-commit hook runs it too): the rules the kit holds itself to, on CI's Python.
# line-length is the longest line in kit/ today, measured 2026-11-08 (the code is not reflowed; E501 is not selected,
# so it only bounds the fixes ruff offers and the rules that weigh a line's length, SIM108 among them)
[tool.ruff]
target-version = "py311"
line-length = 220
extend-exclude = ["kit/camkit/formats", "private", "runs", "site"]

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "SIM"]

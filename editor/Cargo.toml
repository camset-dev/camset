[package]
name = "camset-editor"
default-run = "camset_editor"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"        # the first release with the 2024 edition
description = "Reads, compares and edits Sony camera settings files (CAMSET .DAT)"
license = "MIT"
readme = "../README.md"
# About links to both, the issues page under the repository (window/settings.rs); mkdocs.yml names the same two
repository = "https://github.com/camset-dev/camset"
homepage = "https://camset-dev.github.io/camset/"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17.2"
pollster = "0.4"           # waits on a file dialog on its helper thread (rfd's own Linux portal backend uses it too)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2"

# Windows only (a Windows computer builds the Windows program): build.rs draws the program's icon from assets/icon.png
# with it, for the icon and version details the linker puts into camset_editor.exe (packaging/windows/resources.rs).
# The same crate as above, so nothing new is fetched. Cargo matches this table to the computer that builds, so a
# macOS or Linux build does not compile it for build.rs.
[target.'cfg(windows)'.build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "camset_editor"
path = "src/main.rs"

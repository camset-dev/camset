[package]
name = "camset-editor"
default-run = "camset_editor"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"        # the first release with the 2024 edition
description = "Reads, compares and edits Sony camera settings files (CAMSET .DAT)"
license = "MIT"
readme = "../README.md"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17.2"
pollster = "0.4"           # waits on a file dialog on its helper thread (rfd's own Linux portal backend uses it too)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2"

[[bin]]
name = "camset_editor"
path = "src/main.rs"

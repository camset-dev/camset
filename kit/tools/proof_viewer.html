<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof Viewer</title>
<style>
/* the page for kit/tools/proof_viewer.py, drawn like the editor (egui's dark theme, its menu view): the menu's tabs with
   their colours | the tab's groups | every row of the group and its value | the chosen row. Narrower windows
   follow Material 3's window size classes: the tabs go to a strip on top under 1440 px, the groups to a list
   above the rows under 1100 px, and under 760 px one pane shows at a time (Back returns). */
:root {
  --bg: #1b1b1b; --side: #202020; --ink: #d2d2d2; --strong: #f0f0f0; --muted: #8c8c8c; --rule: #3a3a3a;
  --sel: #005c80; --sel-ink: #ffffff; --hover: #2c2c2c; --field: #2a2a2a; --link: #6cb6ff;
  /* the hex's chosen bytes and the item lit in a list (apart from --sel, which the lists and chips keep): ink on
     the highlight 4.5:1 or more; --hexrec, faint, the record or block around them */
  --hexsel: #19e0ff; --hexsel-ink: #04151c; --hexrec: rgba(25, 224, 255, .15);
  --ok: #5abe6e; --warn: #eba03c; --accent: #ff8a3d; --shade: rgba(8, 8, 10, .95);
  --body: "Ubuntu", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
  --top: 0px;
  color-scheme: dark;
}
/* the system's light theme (the page has no switch of its own, so no data-theme override either) */
@media (prefers-color-scheme: light) { :root {
  --bg: #f4f4f4; --side: #ebebeb; --ink: #2a2a2a; --strong: #000; --muted: #6b6b6b; --rule: #d0d0d0;
  --sel: #90d1ff; --sel-ink: #000; --hover: #e2e2e2; --field: #fff; --ok: #2f7d43; --warn: #9a5f00; --accent: #c84d0a; --link: #0b5cad;
  --hexsel: #0b63c7; --hexsel-ink: #ffffff; --hexrec: rgba(11, 99, 199, .14);
  color-scheme: light } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--body); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }

/* the editor's top bar */
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
header.top h1 { font-size: 1.15rem; font-weight: 500; margin: 0; color: var(--strong); }
.file { font-size: .86rem; color: var(--muted); }
.file b { color: var(--ink); font-weight: 500; }
.file .warn { color: var(--warn); }
#file { transition: background-color 1.2s ease-out; border-radius: 4px; }
#file.flash { background: rgba(255, 200, 0, .45); transition: none; }
@media (prefers-reduced-motion: reduce) { #file { transition: none; } }
/* the definition viewer (proof_viewer.py --public): its one action stands out, and a standing notice says when a file
   is read with another firmware's definition or with none */
.button.primary { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); font-weight: 500; }
.button:disabled, button:disabled, .button[aria-disabled="true"] { opacity: .5; cursor: default; }
.notice { flex: 1 0 100%; font-size: .86rem; background: var(--side); border-left: 3px solid var(--warn); border-radius: 0 3px 3px 0; padding: 5px 9px; overflow-wrap: anywhere; }
.notice a, .nodef a { color: var(--link); }
.notice.intro { border-left-color: var(--sel); }
/* what a refused file starts with, under the message that refuses it, for a report of the problem (its lines scroll
   sideways on a narrow screen, never the page) */
.dump { flex: 1 0 100%; min-width: 0; font-size: .86rem; }
.dump p { margin: 0 0 2px; max-width: 75ch; }
.dump .hex { margin: 4px 0 0; }
#loading { flex: 1 0 100%; margin: 0; }
.nodef p { max-width: 75ch; }
.find { flex: 1 1 300px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.find input { flex: 1 1 240px; min-width: 0; font: .92rem var(--body); color: var(--ink); background: var(--field); border: 1px solid var(--rule);
  border-radius: 3px; padding: 5px 8px; min-height: 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips button { font-size: .82rem; cursor: pointer; background: var(--field); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 9px; min-height: 30px; color: var(--ink); }
.chips button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
.tabstrip { display: none; gap: 2px; overflow-x: auto; padding: 4px 8px; border-bottom: 1px solid var(--rule); }

.cols { display: grid; grid-template-columns: 200px 270px minmax(340px, 1fr) minmax(380px, 1.15fr); height: calc(100vh - var(--top)); }
.col { overflow-y: auto; min-width: 0; padding: 10px 10px 40px; border-right: 1px solid var(--rule); }
.col:last-child { border-right: 0; }
.col h2 { font-size: 1.05rem; font-weight: 500; margin: 0 0 8px; padding: 0 4px 6px; border-bottom: 1px solid var(--rule); color: var(--strong); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.back { display: none; }
.sel { background: none; border: 0; text-align: left; cursor: pointer; border-radius: 3px; padding: 3px 6px; width: 100%; display: flex; gap: 8px; align-items: baseline; min-height: 28px; }
.sel:hover { background: var(--hover); }
.sel[aria-current="true"] { background: var(--sel); color: var(--sel-ink); }
.sel .n { color: var(--muted); font-size: .85rem; }
.sel[aria-current="true"] .n { color: inherit; opacity: .8; }
.list { list-style: none; margin: 0; padding: 0; }

/* column 1: the tabs, each with its colour bar as in the editor */
#menu h2 { color: var(--muted); font-size: 1.2rem; border: 0; }
.bar { width: 7px; align-self: stretch; border-radius: 2px; flex: 0 0 auto; }
#menu .sel { font-size: 1rem; padding: 5px 6px; }

/* column 2: groups, numbered as the camera numbers them */
#groups h2 { border-bottom-color: currentColor; }
#groups .num { font: .75rem var(--mono); color: var(--muted); min-width: 1.5em; text-align: right; }
#groups .sel[aria-current="true"] .num { color: inherit; }
#groups .gmode { color: var(--muted); font-size: .8em; }
.sep { margin: 12px 4px 4px; padding-top: 8px; border-top: 1px solid var(--rule); font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

/* column 3: every row of the group and its value, the camera's submenus indented */
.items { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) auto; }
.item { display: contents; cursor: pointer; }
.item > * { padding: 3px 6px; min-height: 27px; display: flex; align-items: center; gap: 6px; }
.item > :first-child { border-radius: 3px 0 0 3px; } .item > :last-child { border-radius: 0 3px 3px 0; }
.item:hover > * { background: var(--hover); }
.item[aria-current="true"] > * { background: var(--sel); color: var(--sel-ink); }
.item .nm, .item .vl { overflow-wrap: anywhere; }
.item .mk { font: .74rem var(--mono); color: var(--muted); white-space: nowrap; justify-content: flex-end; }
/* comparing: a second value column, the rows that differ in magenta */
.items.cmp { grid-template-columns: minmax(0, 1.15fr) minmax(0, .9fr) minmax(0, .9fr) auto; }
.item .cv { overflow-wrap: anywhere; color: var(--muted); }
.item.dif .cv, .item.dif .vl { color: #f07ae6; }
.item[aria-current="true"] .cv, .item.dif[aria-current="true"] .vl { color: inherit; }
.cmpbar { display: inline-flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cmpbar select { font: inherit; font-size: .84rem; background: var(--field); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; min-height: 30px; max-width: 220px; }
.opts li.cmpv { box-shadow: inset 3px 0 0 #f07ae6; }
.meta .dif { color: #f07ae6; }
.opts .cmptag { font-size: .74rem; color: #f07ae6; }
.item[aria-current="true"] .mk { color: inherit; }
.item.off .nm, .item.off .vl { color: var(--muted); }
.item.d1 .nm { padding-left: 22px; } .item.d2 .nm { padding-left: 38px; } .item.d3 .nm { padding-left: 54px; } .item.d4 .nm { padding-left: 70px; }
.item.parent .nm::after { content: " ›"; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); display: inline-block; }
.dot.yes { background: var(--ok); } .dot.part { background: var(--warn); } .dot.na { background: #7d8db3; }
.meta .na { color: #9fb0d6; }
.tag-filter { margin-left: 10px; font-size: .78rem; background: var(--warn); color: #000; border: 0; border-radius: 3px; padding: 1px 8px; cursor: pointer; }
.ihead { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 12px 6px 3px; border-bottom: 1px solid var(--rule); margin-bottom: 2px; }

/* column 4: the chosen row */
.crumb { font-size: .82rem; margin-bottom: 2px; }
.title { font-size: 1.6rem; color: var(--strong); margin: 0 0 4px; line-height: 1.2; overflow-wrap: anywhere; }
.help { color: var(--ink); margin: 0 0 6px; max-width: 75ch; }
/* help text: the camera's guide frames it was read from (▣ guide), and both readings where the readers differed */
.help .guide, .ohelp .guide { font-size: .78rem; white-space: nowrap; }
details.readings { font-size: .8rem; color: var(--muted); margin: 3px 0 0; }
details.readings > summary { cursor: pointer; color: var(--warn); width: fit-content; }
details.readings .rd { margin: 4px 0 6px 14px; overflow-wrap: anywhere; }
details.readings .rd b { color: var(--ink); font-weight: 500; }
.opts li .ohelp { flex: 1 0 100%; font-size: .86rem; padding: 2px 0 4px calc(2.2em + 10px); cursor: auto; max-width: 75ch; }
.opts li.cur .ohelp details.readings, .opts li.cur .ohelp details.readings > summary { color: inherit; }
.opts li .hq { font: .76rem var(--mono); color: var(--muted); }
.opts li.cur .hq { color: inherit; }
.lhelp { font-size: .86rem; margin: 4px 0 8px; }
.dinsp .dhelp { grid-column: 1 / -1; margin-top: 4px; color: var(--ink); font-family: var(--body); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.tilev { font-size: 1.3rem; color: var(--strong); }
.meta { font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0; }
.meta .ok { color: var(--ok); } .meta .warn { color: var(--warn); }
.note { font-size: .84rem; color: var(--muted); margin: 6px 0; max-width: 80ch; }
.why { color: var(--warn); font-size: .86rem; margin: 2px 0 6px; }
.opts { list-style: none; margin: 8px 0; padding: 0; }
.opts li { display: flex; flex-wrap: wrap; gap: 0 10px; align-items: baseline; padding: 3px 8px; border-radius: 3px; min-height: 28px; }
.opts li .v { font: .76rem var(--mono); color: var(--muted); min-width: 2.2em; text-align: right; }
.opts li .lab { flex: 1; overflow-wrap: anywhere; }
.opts li .pf { font-size: .76rem; color: var(--muted); white-space: nowrap; }
.opts li .pf.yes { color: var(--ok); }
.opts li.has { cursor: pointer; } .opts li.has:hover { background: var(--hover); }
.opts li .pics { font: .76rem var(--mono); color: var(--accent); white-space: nowrap; }
.opts li.cur { background: var(--sel); color: var(--sel-ink); }
.opts li.cur .v, .opts li.cur .pf, .opts li.cur .pics { color: inherit; }
.opts li.on { outline: 2px solid var(--accent); outline-offset: -2px; }
.rec { border-top: 1px solid var(--rule); margin-top: 14px; padding-top: 10px; }
.rec:first-of-type { border-top: 0; margin-top: 4px; }
.rec h3 { margin: 0; font-size: 1.05rem; font-weight: 500; color: var(--strong); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.key { font: .78rem var(--mono); color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0; font-size: .82rem; color: var(--muted); }
.tools button { font-size: .84rem; cursor: pointer; background: var(--field); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 10px; min-height: 30px; color: var(--ink); }
.gallery:empty { display: none; }
.ev { border-left: 3px solid var(--accent); padding: 2px 0 8px 10px; margin: 10px 0 0; }
.ev .what { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
.ev .what b { color: var(--strong); font-weight: 500; }
.ev .where { font-size: .76rem; color: var(--muted); overflow-wrap: anywhere; }
/* a value's gallery: one line saying what the pictures are, the proofs first (green: they prove the value), the
   rest folded under a summary each (grey: extra evidence) */
.gnote { font-size: .8rem; color: var(--muted); margin: 8px 0 0; max-width: 80ch; }
.ev.proof { border-left-color: var(--ok); }
.ev.side { border-left-color: var(--rule); }
.ev .sub { margin-top: 8px; }
details.more { margin: 10px 0 0; }
details.more > summary { cursor: pointer; font-size: .84rem; color: var(--ink); padding: 3px 0; overflow-wrap: anywhere; }
details.more > summary:hover { color: var(--strong); }
/* frames are 640 x 480: as many columns as fit at 300 px or more, each growing to its own 640 pixels */
.thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 640px)); gap: 8px; margin-top: 6px; }
.thumbs figure { margin: 0; max-width: 640px; }
.thumbs img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; border-radius: 3px; border: 1px solid var(--rule); cursor: zoom-in; background: #000; display: block; }
.thumbs figcaption { font-size: .76rem; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
.reclist { list-style: none; margin: 6px 0; padding: 0; }
.reclist button { background: none; border: 0; cursor: pointer; color: var(--ink); padding: 3px 6px; border-radius: 3px; text-align: left; width: 100%; display: flex; gap: 8px; align-items: baseline; }
.reclist button:hover { background: var(--hover); }
.empty { color: var(--muted); }

.box { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
.box.open { display: flex; }
.box img { width: min(100%, calc((100vh - 130px) * 4 / 3)); height: auto; border-radius: 3px; background: #000; }
.box .cap { color: #eee; font: .85rem var(--mono); margin-top: 10px; text-align: center; max-width: 90ch; overflow-wrap: anywhere; }
.box .bar2 { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
.box button, .box a { font-size: .88rem; background: #2c2c2c; color: #eee; border: 1px solid #555; border-radius: 3px; padding: 6px 14px; min-height: 36px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }

/* the view switch, like the editor's Edit | Compare */
.modes { display: inline-flex; }
.modes button { cursor: pointer; background: var(--field); border: 1px solid var(--rule); padding: 4px 14px; min-height: 32px; font-size: .95rem; }
.modes button:first-child { border-radius: 3px 0 0 3px; } .modes button:last-child { border-radius: 0 3px 3px 0; border-left: 0; }
.modes button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); }
body.layout .tabstrip { display: none !important; }
body.layout .find { display: none; }
.laytools { display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
body.layout .laytools { display: inline-flex; }
.laytools input { font: inherit; font-size: .84rem; background: var(--field); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; min-height: 30px; padding: 2px 6px; }
/* the bytes: the whole file in the middle, the byte map as a strip beside it; two dumps side by side; the map */
#lcenter { display: flex; flex-direction: column; overflow: hidden; }
#lcenter .cpane { flex: 1 1 auto; min-height: 0; }
#lcenter .cpane[hidden] { display: none; }
#lcenter .cpane.scrolls { overflow: auto; }
.hexwrap { display: flex; gap: 8px; height: 100%; }
#bigHex { flex: 1 1 auto; min-width: 0; height: 100%; }
#strip { flex: 0 0 34px; width: 34px; height: 100%; cursor: pointer; border-radius: 3px; }
.vhex.fill { height: 100%; margin: 0; font-size: .78rem; }
#pane-diff { display: flex; flex-direction: column; }
.diffhead { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: .82rem; color: var(--muted); padding: 0 0 4px; }
.diffwrap { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.diffwrap .vhex { height: 100%; margin: 0; font-size: .78rem; }
.ctabs button { font-size: .84rem; }
.vhex { user-select: none; outline: 0; }
.dinsp { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: .82rem; margin: 0 0 10px; padding: 6px 8px; background: var(--side); border-radius: 3px; }
.dinsp .k { color: var(--muted); } .dinsp .m { font-family: var(--mono); overflow-wrap: anywhere; }
.dinsp h3 { grid-column: 1 / -1; margin: 0 0 3px; font-size: .8rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

/* the file layout view: structure | byte map | the chosen bytes, with a divider to drag between each two */
.lay { display: grid; grid-template-columns: var(--lw1, 520px) 7px minmax(240px, 1fr) 7px var(--lw3, 360px); height: calc(100vh - var(--top)); }
.lay[hidden], .cols[hidden] { display: none; }
.lay .col { border-right: 0; }
.split { cursor: col-resize; touch-action: none; background: linear-gradient(var(--rule), var(--rule)) center / 1px 100% no-repeat; }
.split:hover, .split:focus-visible, .split.drag { background: linear-gradient(var(--sel), var(--sel)) center / 3px 100% no-repeat; outline: 0; }
/* the structure: the file's parse tree as the format spec names it, with columns (as 010 Editor's Template
   Results and ImHex's Pattern Data show one) */
#ltree { overflow-x: auto; }
.tt { --tc1: 130px; --tc2: 62px; --tc3: 42px; --tc4: 64px; --tc5: 80px; --tc6: 70px;
  min-width: calc(var(--tc1) + var(--tc2) + var(--tc3) + var(--tc4) + var(--tc5) + var(--tc6) + 52px); font-size: .86rem; }
.tt .row { display: grid; grid-template-columns: var(--tc1) var(--tc2) var(--tc3) var(--tc4) var(--tc5) minmax(var(--tc6), 1fr);
  gap: 0 8px; align-items: baseline; width: 100%; background: none; border: 0; border-radius: 3px; padding: 2px 6px;
  min-height: 24px; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.tt .row:hover { background: var(--hover); }
.tt .row[aria-current="true"] { background: var(--sel); color: var(--sel-ink); }
.tt .head { position: sticky; top: -10px; z-index: 1; background: var(--bg); color: var(--muted); font-size: .76rem;
  cursor: default; border-bottom: 1px solid var(--rule); border-radius: 0; }
.tt .head:hover { background: var(--bg); }
.tt .head > span { position: relative; overflow: visible; }
.tt .colgrip { position: absolute; top: -2px; right: -7px; width: 9px; height: calc(100% + 4px); cursor: col-resize; z-index: 2; }
.tt .colgrip:hover, .tt .colgrip.drag { background: linear-gradient(var(--sel), var(--sel)) center / 2px 100% no-repeat; }
.tt .row > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tt .m { font: .78rem var(--mono); }
.tt .n { text-align: right; }
.tt .tw { display: inline-block; width: 14px; color: var(--muted); }
.tt .row[aria-current="true"] .tw, .tt .row[aria-current="true"] .k { color: inherit; }
.tt .k { color: var(--muted); }
.tt .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tt .dif { color: #f07ae6; margin-left: 6px; }
.cov { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); margin: 0 0 8px; }
.cov span { display: inline-flex; gap: 5px; align-items: center; }
.cov i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.cov b { color: var(--strong); font-weight: 500; }
.covbar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; width: 100%; margin: 2px 0 4px; }
.maptools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 8px; }
.button { cursor: pointer; background: var(--field); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 10px; min-height: 30px; font-size: .84rem; display: inline-flex; align-items: center; }
.maprow { margin: 0 0 10px; }
.maprow.tight { margin: 0 0 3px; }
.maprow .lab { font-size: .8rem; color: var(--muted); margin: 0 0 3px; display: flex; justify-content: space-between; gap: 8px; }
.maprow canvas { display: block; max-width: 100%; cursor: crosshair; }
.maptools select { font: inherit; font-size: .84rem; background: var(--field); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; min-height: 30px; }
.hover { font: .78rem var(--mono); color: var(--muted); min-height: 1.4em; overflow-wrap: anywhere; position: sticky; bottom: 0; background: var(--bg); padding: 4px 0; }
.hex { font: .84rem/1.5 var(--mono); white-space: pre; overflow-x: auto; margin: 8px 0; padding: 6px 8px; background: var(--side); border-radius: 3px; }
.hex .o { color: var(--muted); } .hex .a { color: var(--muted); }
.hex .bh { color: #8fb4ff; } .hex .bv { color: var(--strong); } .hex .bo { color: #555; }
/* a byte's marks, a later one over an earlier where two meet: the record or block around the chosen bytes (faint),
   a range dragged, what differs (magenta), the chosen bytes (--hexsel; a range dragged in them inverted, what differs
   underlined), the setting the menu sent here or a match found (yellow), the cursor's byte (ringed, over its
   neighbours) */
.hex .hrec { background: var(--hexrec); }
.hex .rng { background: rgba(255, 255, 255, .2); }
.hex .df { background: #8a2580; color: #fff; }
.hex .hsel { background: var(--hexsel); color: var(--hexsel-ink); }
.hex .hsel.df { box-shadow: inset 0 -3px 0 #e83ad8; }
.hex .hsel.rng { background: var(--hexsel-ink); color: var(--hexsel); }

/* large (1100-1439): the tabs move to a strip on top */

<script type="module">
"use strict";
// What the build put in the page: one camera's definition with its proofs (kit/tools/proof_viewer.py), or, for the
// definition viewer (--public), the cameras it knows, each camera's own data loaded when it is shown (boot, below).
const BUILT = /*DATA*/null;
// The template itself opened in a browser (kit/tools/proof_viewer.py has not filled it): say so, and stop.
if (BUILT === null) {
  const p = (...kids) => { const e = document.createElement("p"); e.append(...kids); return e; };
  const code = (t) => { const e = document.createElement("code"); e.textContent = t; e.style.fontFamily = "var(--mono)"; return e; };
  const box = document.createElement("main");
  box.style.cssText = "max-width: 40rem; margin: 3rem auto; padding: 0 16px;";
  const h = document.createElement("h1");
  h.textContent = "Proof Viewer";
  box.append(h,
    p("This is the proof viewer's template, not the viewer. Build the viewer with ", code("python3 kit/tools/proof_viewer.py"),
      " on the computer that holds the camera runs (", code("runs/<model>_fw<fw>/"), "); it writes ", code("runs/<model>_fw<fw>/_viewer/index.html"),
      ", which is the page to open."));
  document.body.replaceChildren(box);
  throw new Error("proof_viewer.html is the template; build the viewer with kit/tools/proof_viewer.py");
}
// ---- the definition viewer (proof_viewer.py --public): BUILT.viewer lists the cameras it knows, each with its model,
// firmware, name and container block. The page shows one camera's definition: the one a file opened in the page
// before belongs to (carried over in this tab's session storage while the page starts again with that camera's data),
// else ?camera=<model>_fw<fw>, else the first. A file finds its definition as the editor's Definitions::open does
// (editor/src/schema.rs): by trial, each distinct container block's magic first, then the model and the firmware it
// names, its framing confirmed by the trailer checksum; that model's definition at that firmware, else the nearest
// firmware of that model (of two as near, the newer); a model no definition covers is read with the first block that
// frames it, and nothing is named. A camera's data comes from a script beside the page (data/<model>_fw<fw>.js, which
// fills window[viewer.global]), so the page opens from disk as well as from a site; a single-file build holds them all.
const VIEWER = BUILT && BUILT.viewer ? BUILT.viewer : null;
// a plain object's own value for a key a file or a definition gives ("constructor" and "__proto__" are no colours)
function own(o, k) {
  return o !== null && o !== undefined && Object.prototype.hasOwnProperty.call(o, k) ? o[k] : undefined;
}
const CARRIED = "camset-viewer-file";          // the session storage key of a file carried over to the next start
let OPENED = null;          // that file read by trial ({f, cam, how, model, fw, block, via, name}), opened once the page is drawn
const sameBlock = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// a header part's bytes, read before the records are framed: from the start of the file only (null where the block
// places it from the end, or past the file's end)
function peekRange(d, at, to) {
  if (at.startsWith("end-") || to.startsWith("end-")) return null;
  const a = placeOf(at, d.length), b = placeOf(to, d.length);
  return a <= b && b <= d.length ? d.subarray(a, b) : null;
}
function peekText(d, part) {
  const v = peekRange(d, part.at, part.to);
  if (!v) return null;
  const end = v.indexOf(0);
  return new TextDecoder("utf-8", { ignoreBOM: true }).decode(end < 0 ? v : v.subarray(0, end));
}
function peekFirmware(d, B) {
  const v = peekRange(d, B.firmware.at, B.firmware.to), mm = B.firmware.decode === "major_minor";
  return v && v.length >= (mm ? 2 : 3) ? `${v[0]}.${String(mm ? v[1] : v[1] * 10 + v[2]).padStart(2, "0")}` : null;
}
function magicMatches(d, B) {
  if (B.magic.at.startsWith("end-")) return false;
  const a = placeOf(B.magic.at, d.length);
  return a + B.magic.bytes.length <= d.length && [...B.magic.bytes].every((ch, i) => d[a + i] === ch.charCodeAt(0));
}
// "4.00" as a number to measure firmwares' distance by (the editor's firmware_number), null when it is not one
const fwNumber = (fw) => { const m = /^(\d+)\.(\d+)$/.exec(fw || ""); return m ? +m[1] * 100 + +m[2] : null; };
// the camera whose definition reads a file of `model` and firmware `fw` read with block B: [camera, "exact" | "near"],
// else [null, "none"] (the editor's Definitions::pick)
function pickCamera(cams, B, model, fw) {
  const mine = cams.filter((c) => c.model === model && sameBlock(c.file, B));
  const exact = mine.find((c) => c.firmware === fw);
  if (exact) return [exact, "exact"];
  const a = fwNumber(fw), key = (c) => { const b = fwNumber(c.firmware); return [a === null || b === null ? Infinity : Math.abs(a - b), b === null ? Infinity : -b]; };
  let best = null;
  for (const c of mine) { const k = key(c), kb = best && key(best); if (!best || k[0] < kb[0] || (k[0] === kb[0] && k[1] < kb[1])) best = c; }
  return best ? [best, "near"] : [null, "none"];
}
// a file read by trial with the cameras' blocks (the editor's Definitions::open); throws, with "matched" when some
// block's magic and header fitted (the file is then damaged rather than not a settings file)
function readByTrial(buf, cams) {
  const d = new Uint8Array(buf), blocks = [], others = [];
  for (const c of cams) if (c.file && !blocks.some((b) => sameBlock(b, c.file))) blocks.push(c.file);
  let err = null, matched = false;
  const frame = (B) => {
    try {
      const f = parseCamset(buf, B);
      if (f.bodySum.stored === f.bodySum.computed) return f;
      err = new Error(`checksum mismatch (stored 0x${f.bodySum.stored.toString(16)}, computed 0x${f.bodySum.computed.toString(16)})`);
    } catch (e) { err = e; }
    return null;
  };
  for (const B of blocks) {
    const model = peekText(d, B.model), fw = peekFirmware(d, B);
    if (model === null || fw === null || !magicMatches(d, B)) continue;
    matched = true;
    const [cam, how] = pickCamera(cams, B, model, fw);
    if (!cam) { others.push([B, model, fw]); continue; }
    const f = frame(B);
    if (f) return { f, cam, how, model, fw, block: B };
  }
  for (const [B, model, fw] of others) {          // no definition of its model: the first container that frames it
    const f = frame(B);
    if (f) return { f, cam: null, how: "none", model, fw, block: B, via: cams.find((c) => sameBlock(c.file, B)) };
  }
  throw Object.assign(err || new Error("not a camera settings file"), { matched });
}
// a file kept in this tab's session storage for the next start of the page (false when the browser keeps none), and
// taken back out at that start
function carry(buf, name) {
  const u8 = new Uint8Array(buf);
  let bin = "";
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode(...u8.subarray(i, i + 0x8000));
  try { sessionStorage.setItem(CARRIED, JSON.stringify({ name, b64: btoa(bin) })); return true; } catch { return false; }
}
function carried() {
  try {
    const kept = sessionStorage.getItem(CARRIED);
    if (!kept) return null;
    sessionStorage.removeItem(CARRIED);
    const { name, b64 } = JSON.parse(kept), bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return { name, buf: u8.buffer };
  } catch { return null; }
}
// a camera's data: already in the page (a single-file build), else from its script beside the page
function cameraData(cam, V) {
  const have = () => own(window[V.global], cam.key);
  if (have()) return Promise.resolve(have());
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = `${V.data}${encodeURIComponent(cam.key)}.js`;
    s.onload = () => (have() ? ok(have()) : fail(new Error(`${s.src} holds no data for ${cam.key}`)));
    s.onerror = () => fail(new Error(`${s.src} could not be loaded`));
    document.head.append(s);
  });
}
// the page for a file no definition describes: no records, no menu but a panel that says so, the file read with the
// container block that framed it (DATA.foreign)
function foreignData(got) {
  return { public: true, foreign: { firmware: got.fw, via: got.via }, model: got.model, camera: "", pictures: 0, file: null, values: "",
    colors: {}, format: got.block, memory_names: {}, memory_modes: {}, records: {}, my_menu: null, main: null, guides: [], help_source: {},
    menu: [{ tab: "This file", groups: [], others: [], special: [{ name: "No definition yet", num: "", kind: "nodef" }] }] };
}
async function boot(V) {
  const ask = new URLSearchParams(location.search).get("camera");
  let cam = V.cameras.find((c) => c.key === ask) || V.cameras[0];
  const kept = carried();
  if (kept) {
    try { OPENED = { ...readByTrial(kept.buf, V.cameras), name: kept.name }; } catch { OPENED = null; }
    if (OPENED && !OPENED.cam) return foreignData(OPENED);
    if (OPENED) cam = OPENED.cam;
  }
  if (cam.key !== ask && (ask || OPENED)) history.replaceState(null, "", `?camera=${encodeURIComponent(cam.key)}${location.hash}`);
  try {
    return await cameraData(cam, V);
  } catch (e) {
    const p = document.createElement("p");
    p.style.cssText = "max-width: 40rem; margin: 3rem auto; padding: 0 16px;";
    p.textContent = `The definition viewer could not load ${cam.name}'s definition: ${e.message}. Reload the page; if this was opened from a folder on disk, keep its data folder beside it.`;
    document.body.replaceChildren(p);
    throw e;
  }
}
const DATA = VIEWER ? await boot(VIEWER) : BUILT;
const $ = (id) => document.getElementById(id);
// the row marked chosen in a list (the tree, the groups, the rows) brought into view
const intoView = (id, block = "nearest") => $(id).querySelector('[aria-current="true"]')?.scrollIntoView({ block });
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k);
  return e;
}
// what this browser keeps between visits (the map's row length, the column widths, the view): nothing when storage is
// off, and a value it does not know is the default
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* not kept */ } } };
const storedJson = (k) => { try { return JSON.parse(store.get(k) || "{}") || {}; } catch { return {}; } };
const R = DATA.records;
for (const r of Object.values(R)) {
  r.pics = r.ev.reduce((n, e) => n + e.frames.length, 0);
  r.text = [r.n, r.k, r.g, ...r.menu, ...r.vals.map((v) => v[1])].join(" ").toLowerCase();
}
const color = (tab) => { const c = own(DATA.colors, tab); return Array.isArray(c) ? `rgb(${c.join(",")})` : "var(--muted)"; };
// the Main entry at the top of the Menu column (camera.main_tiles: each mode a group, its tiles the rows) and My Menu
// made whole (camera.my_menu: the file's pages and the item names by code, beside its stray settings); a definition
// without either has neither
// The definition viewer has two menus, the editor's own (the live settings without the Expert ones) and, with its
// Expert switch, every setting (DATA.menu_expert); a node there carries only what it has, the rest its empty value.
const MENUS = DATA.menu_expert ? { off: DATA.menu, on: DATA.menu_expert } : null;

  $("notice").replaceChildren(`See what is in a Sony camera settings file (CAMSET*.DAT), every setting by name. ${cam ? `The ${cam.name} sample is shown` : "A sample is shown"} `
    + "until you open your own file, which stays on your computer.");
  $("notice").classList.add("intro");
  $("notice").hidden = false;
}
// a file the definition viewer cannot read, in the editor's words: not a settings file any definition here
// describes, or one that is damaged
function unreadable(err, name) {
  const known = VIEWER.cameras.map((c) => `${c.name}, firmware ${c.firmware}`).join("; ");
  return el("span", { class: "warn", title: err.message }, err.matched
    ? `${name}: this settings file is damaged or incomplete; it may have been cut short when it was copied. Copy it from the card again.`
    : `${name}: this is not a settings file this viewer can read: it reads files laid out like those of the cameras it knows (${known}).`);
}
// a file's first n bytes as a classic hex dump, the lines `hexdump -Cv` prints (every line, none folded into a "*"):
// the offset, sixteen bytes in hex in two groups of eight, and the same bytes as text between bars, a dot for each that
// is not printable ASCII. It touches no page, so a check runs it on its own (node).
function hexDump(u8, n) {
  const lines = [], end = Math.min(n, u8.length);
  for (let p = 0; p < end; p += 16) {
    const row = [...u8.subarray(p, Math.min(p + 16, end))];
    let hx = "";
    for (let i = 0; i < 16; i++) hx += (i < row.length ? row[i].toString(16).padStart(2, "0") : "  ") + (i === 7 ? "  " : " ");
    lines.push(`${hexOff(p)}  ${hx} |${row.map((c) => (c >= 32 && c < 127 ? String.fromCharCode(c) : ".")).join("")}|`);
  }
  return lines;
}
// what a file the definition viewer refused starts with, under the message that refuses it: its size and its first
// DUMP_BYTES bytes as a hex dump, for whoever reports the problem to paste, after checking it holds nothing of theirs
// (a report is usually public); read here, like the file itself, and sent nowhere. The box is a group named by its
// visible title (#dumptitle). None (null) hides it: every file opened starts without it, and a file that is read
// never shows it.
const DUMP_BYTES = 256;
function showStart(buf, name) {
  const box = $("dump");
  box.hidden = !buf;
  if (!buf) { box.replaceChildren(); fit(); return; }
  const u8 = new Uint8Array(buf), n = Math.min(u8.length, DUMP_BYTES);
  box.replaceChildren(el("p", {}, el("b", { id: "dumptitle" }, `What ${name} starts with`), ", to paste into a report of the problem. The file was read in this browser and never left it: nothing was sent anywhere."),
    el("p", {}, "Before you paste it anywhere public, check that it holds nothing of yours: a document or photo chosen by mistake shows its own first bytes, "
      + "and a settings file's can show the camera's model, when the file was saved and some of your settings."),
    el("pre", { class: "hex" }, [`${name}: ${u8.length} bytes${n < u8.length ? `, the first ${n} of them:` : ":"}`, ...hexDump(u8, n)].join("\n")));
  fit();
}
// the panel the Menu shows for a file no definition describes
function nodefDetail() {
  const f = L.f, via = DATA.foreign.via, link = (path, words) => el("a", { href: `${VIEWER.docs}${path}`, target: "_blank", rel: "noopener" }, words);
  return [el("div", { class: "nodef" }, el("div", { class: "title" }, "No definition for this camera yet"),
    f ? el("p", {}, `${DATA.file.name} says it is from ${cameraWords(f.model, firmware(f))}, saved ${f.saved || "at a time it does not give"}.`) : null,
    el("p", {}, "No camera definition describes this model, so its settings cannot be named here, and no other camera's names are put on them. "
      + `The File layout view shows the file's structure all the same: its header, its sections, every record by id and size, the bytes, the map and the inspector, read with the ${viaWords(via)} file layout, which fits this file.`),
    el("p", {}, `This viewer knows ${VIEWER.cameras.length === 1 ? "one camera" : `${VIEWER.cameras.length} cameras`}: ${VIEWER.cameras.map((c) => `${c.name}, firmware ${c.firmware}`).join("; ")}.`),
    el("p", {}, "A camera gets its definition by being mapped with Camset's kit: ", link("QUICKSTART/", "how a camera gets mapped"), " · ", link("CAMERA_SUPPORT/", "which cameras the kit works with"), "."),
    el("button", { class: "button", onclick: () => setMode("layout") }, "Show the file's structure"))];
}
// a file opened in the definition viewer: read by trial with every camera's block; this camera's (or the nearest
// firmware's of this model, when it is this page's) shown here, another camera's, or none's, by starting the page again
// with it, the file carried over in this tab
function openInViewer(buf, name) {
  let got;
  try { got = readByTrial(buf, VIEWER.cameras); } catch (err) { $("mainmsg").replaceChildren(unreadable(err, name)); showStart(buf, name); return; }
  if (got.cam && got.cam.key === DATA.camera) { initLayout(); useFile(got.f, name); return; }
  const whose = got.cam ? `${got.cam.name}, firmware ${got.cam.firmware}` : `${got.model}, which no definition here describes`;
  if (carry(buf, name)) {
    $("mainmsg").textContent = `${name} is from ${got.model} firmware ${got.fw}: opening it with ${got.cam ? `the ${got.cam.model} firmware ${got.cam.firmware} definition` : "no definition"}…`;
    location.assign(got.cam ? `?camera=${encodeURIComponent(got.cam.key)}` : location.search || "?");
    return;
  }
  if (!got.cam && sameBlock(got.block, FMT)) { becomeForeign(got, name); return; }
  $("mainmsg").replaceChildren(el("span", { class: "warn" }, got.cam
    ? `${name} is from ${cameraWords(got.model, got.fw)}, which this viewer reads with the ${got.cam.model} firmware ${got.cam.firmware} definition: choose that camera at the top and Show, then open the file again (this browser keeps no file while the page changes camera).`
    : `${name} is from ${whose}; this browser keeps no file while the page starts again, and this page reads files laid out another way, so its structure cannot be shown here.`));
}
// this page made the one for a file no definition describes, in place (when the browser keeps no file for the next
// start): every record, menu, name and memory of this camera's definition let go, as foreignData has none, the file
// read with this page's own container block, which framed it
function becomeForeign(got, name) {
  for (const k of Object.keys(R)) delete R[k];
  KEYS.clear(); MMI = null;
  Object.assign(DATA, foreignData(got));
  delete DATA.menu_expert;
  if (MENUS) MENUS.off = MENUS.on = DATA.menu;
  history.replaceState(null, "", location.pathname + location.search);          // no #layout|<key> of the camera before
  $("expert").hidden = true;
  const find = document.querySelector(".find");
  if (find) find.style.display = "none";
  [...$("camera").children].forEach((o) => { o.selected = false; });
  $("camera").append(el("option", { value: "", selected: true, disabled: true }, `${cameraWords(got.model, got.fw)} (no definition)`));
  $("camera").value = "";
  // the way back to a camera the viewer knows, though it knows one only (the list's change turns Show on)
  $("camlabel").hidden = $("camshow").hidden = false;
  $("camshow").disabled = true;
  Object.assign(state, { tab: "This file", group: null, item: null, filter: "all", q: "" });
  $("q").value = "";
  useFile(got.f, name);
}
$("mainfile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  showStart(null);
  $("mainmsg").textContent = `Reading ${file.name}…`;
  try {
    const buf = await file.arrayBuffer();
    if (!buf.byteLength) throw new Error(`${file.name} is empty (0 bytes): if it was picked straight from the camera over USB, copy it to this computer first`);
    if (VIEWER) openInViewer(buf, file.name); else { initLayout(); useFile(parseCamset(buf), file.name); }
  } catch (err) {
    $("mainmsg").textContent = err.message.startsWith(file.name) ? err.message : `${file.name}: ${err.message}`;
  }
  e.target.value = "";
});
function setMode(m) {
  $("m-menu").setAttribute("aria-pressed", String(m === "menu")); $("m-layout").setAttribute("aria-pressed", String(m === "layout"));
  $("cols").hidden = m !== "menu"; $("lay").hidden = m !== "layout"; document.body.classList.toggle("layout", m === "layout");
  if (m === "layout") { initLayout(); fit(); drawLayout(); }
  fit();
}
$("m-menu").onclick = () => { setMode("menu"); draw(); };
$("m-layout").onclick = () => setMode("layout");
window.addEventListener("resize", redrawMaps);

function fit() { document.documentElement.style.setProperty("--top", ($("top").offsetHeight + ($("lay").hidden ? $("tabstrip").offsetHeight : 0)) + "px"); }
window.addEventListener("resize", fit);
let timer = null;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { state.q = $("q").value; draw(); }, 150); });
function fromHash() {
  try {
    const [t, g, i] = decodeURIComponent(location.hash.slice(1)).split("|");
    if (DATA.menu.some((x) => x.tab === t)) Object.assign(state, { tab: t, group: g || null, item: i || null });
  } catch { /* a plain address */ }
}
// ---- go to an offset or a record; find bytes or a setting's name (the layout view's own top-bar tools)
function choose(p, len) {
  C.cursor = p; C.mark = len ? [p, p + len] : null; L.pick = null; C.range = null;
  selectAt(p);
  drawLayout(false);
  if (C.view === "hex" && C.hex) C.hex.goTo(p); else drawCenter(p);
  intoView("tree");
}
$("goto").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || !L.f) return;
  const q = e.target.value.trim(), f = L.f;
  let m = q.match(/^(?:id|r|#)\s*(?:0x)?([0-9a-f]{1,4})$/i);
  if (m) {
    const rec = byId(f, CMP.show).get(parseInt(m[1], 16));
    $("findn").textContent = rec ? "" : `no record 0x${m[1]} in ${setName(CMP.show)}`;
    if (rec) choose(rec.off, rec.end - rec.off);
    return;
  }
  m = q.match(/^(?:0x)?([0-9a-f]+)$/i);
  const at = m ? parseInt(m[1], 16) : NaN;
  $("findn").textContent = at < f.size ? "" : "an offset (0x1a33) or a record (id 0334)";
  if (at < f.size) choose(at, 0);
});
const FIND = { q: "", hits: [], i: -1 };
function runFind(q) {
  const f = L.f, hits = [];
  const bytes = /^[0-9a-f]{2}(\s+[0-9a-f]{2})*$/i.test(q) ? q.split(/\s+/).map((x) => parseInt(x, 16)) : null;
  if (bytes) {
    for (let p = 0; p + bytes.length <= f.size && hits.length < 5000; p++) {
      let ok = true;
      for (let k = 0; k < bytes.length; k++) if (f.u8[p + k] !== bytes[k]) { ok = false; break; }
      if (ok) hits.push([p, bytes.length]);
    }
  } else if (q) {
    // a setting's name: its records in the section the page shows
    const want = q.toLowerCase();
    for (const r of f.sections[CMP.show].recs) if ((nameOf(r.sec, r.id) || "").toLowerCase().includes(want) || keysFor(r.sec, r.id).some((k) => R[k].n.toLowerCase().includes(want))) hits.push([r.off, r.end - r.off]);
  }
  Object.assign(FIND, { q, hits, i: -1 });
}
function findStep(d) {
  if (!L.f) return;
  const q = $("findq").value.trim();
  if (q !== FIND.q) runFind(q);
  if (!FIND.hits.length) { $("findn").textContent = q ? "no match" : ""; C.mark = null; return; }
  FIND.i = (FIND.i + d + FIND.hits.length) % FIND.hits.length;
  const [p, len] = FIND.hits[FIND.i];
  $("findn").textContent = `${FIND.i + 1} of ${FIND.hits.length}${FIND.hits.length >= 5000 ? "+" : ""}`;
  choose(p, len);
}
$("findq").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); } });
$("findnext").onclick = () => findStep(1);
$("findprev").onclick = () => findStep(-1);

// "#layout|<key>": a setting's bytes in the layout view (Back returns to the menu view)
const layoutKey = () => { try { const h = decodeURIComponent(location.hash.slice(1)); return h.startsWith("layout|") ? h.slice(7) : null; } catch { return null; } };
window.addEventListener("hashchange", () => {
  const k = layoutKey();
  if (k) { showInLayout(k, false); return; }
  if (!$("lay").hidden) setMode("menu");
  let hash;
  try { hash = decodeURIComponent(location.hash.slice(1)); } catch { return; }          // a plain address
  const [t, g, i] = hash.split("|");
  if (t !== state.tab || g !== state.group || i !== state.item) { fromHash(); draw(); }
});
const startKey = layoutKey();
initLayout(); cmpOptions(); fromHash(); chips(); draw(); fit();
if (VIEWER && !OPENED) intro();
if (OPENED) useFile(OPENED.f, OPENED.name);          // the file carried over to this start (the definition viewer)
$("loading").remove();
$("mainfile").disabled = false;
$("openfile").removeAttribute("aria-disabled");
fit();
if (startKey) showInLayout(startKey, false);
</script>
